<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Colabo — Tidak tersambung</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --text: #0f172a;
      --muted: #475569;
      --muted-soft: #64748b;
      --rule: rgba(148, 163, 184, 0.32);
      --hover: #f1f5f9;
      --primary-ring: rgba(109, 93, 252, 0.32);
      --danger: #f43f5e;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      min-height: 100vh;
      padding: 80px 24px;
      display: flex;
      justify-content: center;
    }

    .stack {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--danger);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #0f172a;
      line-height: 1.2;
    }

    .lede {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--rule);
    }

    nav.links {
      display: flex;
      flex-direction: column;
      margin: -4px -8px 0;
    }

    nav.links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      margin: 0;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      transition: background-color 120ms ease-out, color 120ms ease-out;
    }

    nav.links a:hover {
      background: var(--hover);
    }

    nav.links a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--primary-ring);
    }

    nav.links a svg {
      width: 16px;
      height: 16px;
      color: #94a3b8;
      transition: transform 120ms ease-out, color 120ms ease-out;
    }

    nav.links a:hover svg {
      transform: translateX(2px);
      color: #475569;
    }

    .foot {
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted-soft);
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="stack">
      <p class="status"><span class="dot" aria-hidden="true"></span> Tidak tersambung.</p>

      <div>
        <h1>Tersambung lagi sebentar.</h1>
        <p class="lede">
          Kami akan mengembalikan Anda begitu koneksi pulih. Sementara itu, Dashboard dan tugas yang tersimpan masih bisa dibuka.
        </p>
      </div>

      <div class="divider"></div>

      <nav class="links" aria-label="Halaman tersedia offline">
        <a href="/dashboard">
          <span>Buka Dashboard tersimpan</span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
        <a href="/my-tasks">
          <span>Buka Tugas saya</span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4l4 4-4 4" />
          </svg>
        </a>
      </nav>

      <p class="foot">
        Akan otomatis kembali ke halaman Anda saat koneksi pulih.
      </p>
    </section>
  </main>

  <script>
    (function () {
      var reloaded = false;
      var reload = function () {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      };
      window.addEventListener("online", reload);
      // Fallback heartbeat: try every 5s in case the online event never fires (captive portal recoveries, some Linux desktops).
      setInterval(function () {
        if (navigator.onLine) reload();
      }, 5000);
    })();
  </script>
</body>
</html>
