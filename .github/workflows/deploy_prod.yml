name: Deploy React (Bun) to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-frontend-react-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_NAME: frontend-react
      BUILD_DIR: dist
      DEPLOY_PATH: /var/www/html/colabo/frontend-react
      HEALTHCHECK_URL: https://colabo.hecolab.id

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🟣 Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 📦 Install dependencies (deterministic)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ⚙️ Use production env
      - name: Use production env
        run: cp .env.prod .env

      # 🏗️ Build
      - name: Build React app
        run: bun run build

      # 📦 Archive build
      - name: Create release archive
        run: |
          tar -czf release.tar.gz -C $BUILD_DIR .

      # 🚀 Upload ke VPS
      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: release.tar.gz
          target: /tmp/${{ env.APP_NAME }}

      # 🔁 Deploy + rollback
      - name: Deploy with rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            APP_NAME="${{ env.APP_NAME }}"
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            RELEASE_ID="${{ github.sha }}"
            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
            CURRENT_LINK="$DEPLOY_PATH/current"
            PREVIOUS_RELEASE=""

            echo "📁 Setup directories..."
            mkdir -p "$DEPLOY_PATH/releases"

            if [ -L "$CURRENT_LINK" ]; then
              PREVIOUS_RELEASE=$(readlink -f "$CURRENT_LINK")
              echo "Previous release: $PREVIOUS_RELEASE"
            fi

            echo "📦 Extract new release..."
            mkdir -p "$RELEASE_DIR"
            tar -xzf "/tmp/$APP_NAME/release.tar.gz" -C "$RELEASE_DIR"

            echo "🔗 Switch symlink..."
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            echo "🔄 Reload nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "🩺 Health check..."
            sleep 3

            if ! curl -f -s "${{ env.HEALTHCHECK_URL }}" > /dev/null; then
              echo "❌ Health check failed → rollback"

              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"
                sudo systemctl reload nginx
                echo "✅ Rollback success"
              else
                echo "⚠️ No previous release found"
              fi

              exit 1
            fi

            echo "✅ Deployment successful"

            echo "🧹 Cleanup old releases..."
            cd "$DEPLOY_PATH/releases"
            ls -dt */ | tail -n +6 | xargs -r rm -rf

            echo "🧹 Cleanup temp..."
            rm -rf "/tmp/$APP_NAME"